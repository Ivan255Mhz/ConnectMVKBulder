name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-pack:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ConnectMVKBulder.sln

      - name: Build
        run: dotnet build ConnectMVKBulder.sln -c Release --no-restore

      - name: Test
        run: dotnet test ConnectMVKBulder.sln -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Pack
        run: dotnet pack ConnectMVKBulder.sln -c Release --no-build -o nupkgs

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs-${{ matrix.os }}
          path: |
            nupkgs/*.nupkg
            nupkgs/*.snupkg
          if-no-files-found: error
